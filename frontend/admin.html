<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel – Task Manager</title>
<link href="admin.css" rel="stylesheet">
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">// task_manager v2.0</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="login-btn" onclick="doLogin()">Login</button>
    <div class="login-error" id="loginError">Invalid email or password</div>
  </div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-text">Task Manager</div>
    <div class="logo-sub">admin dashboard</div>
  </div>
  <nav>
    <div class="nav-item active" onclick="switchTab('users', this)">
      <span class="nav-icon">👤</span> Users
    </div>
    <div class="nav-item" onclick="switchTab('logs', this)">
      <span class="nav-icon">📋</span> Login Logs
    </div>
    <div class="nav-item" onclick="switchTab('tasks', this)">
      <span class="nav-icon">✅</span> Tasks
    </div>
  </nav>
  <div class="sidebar-footer">
    <span class="status-dot"></span>backend online
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="page-title" id="pageTitle">Users</div>
    <div class="topbar-right">
      <button class="refresh-btn" onclick="loadAll()">↻ REFRESH</button>
    </div>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card users">
        <div class="stat-label">Users</div>
        <div class="stat-value" id="statUsers">—</div>
      </div>
      <div class="stat-card logs">
        <div class="stat-label">Login Events</div>
        <div class="stat-value" id="statLogs">—</div>
      </div>
      <div class="stat-card tasks">
        <div class="stat-label">Tasks</div>
        <div class="stat-value" id="statTasks">—</div>
      </div>
    </div>

    <!-- USERS PANEL -->
    <div class="panel active" id="panel-users">
      <div class="table-wrap">
        <div class="table-header">
          <span class="table-title">Registered Users</span>
          <span class="table-count" id="countUsers">0 rows</span>
        </div>
        <div id="usersTable"><div class="loading">loading...</div></div>
      </div>
    </div>

    <!-- LOGS PANEL -->
    <div class="panel" id="panel-logs">
      <div class="table-wrap">
        <div class="table-header">
          <span class="table-title">Login History</span>
          <span class="table-count" id="countLogs">0 rows</span>
        </div>
        <div id="logsTable"><div class="loading">loading...</div></div>
      </div>
    </div>

    <!-- TASKS PANEL -->
    <div class="panel" id="panel-tasks">
      <div class="table-wrap">
        <div class="table-header">
          <span class="table-title">All Tasks</span>
          <span class="table-count" id="countTasks">0 rows</span>
        </div>
        <div id="tasksTable"><div class="loading">loading...</div></div>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
